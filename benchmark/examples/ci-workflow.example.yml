name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-release.py --tree HEAD --history
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/claude_code_harness.py inference --config examples/inference.example.json --output outputs/check --validate-only
      - run: python scripts/claude_code_harness.py judge --config examples/judges.example.json --output outputs/check --validate-only
